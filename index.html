
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f5f2ff;
  color: #62538f;
  font-family: Georgia, serif;
  overflow: hidden;
}

main {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: clamp(28px, 7vw, 40px);
  font-weight: normal;
  margin: 0 0 24px;
}

.gif {
  display: block;
  width: min(220px, 65vw);
  max-height: 220px;
  object-fit: contain;
  margin: 0 auto 28px;
}

.buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  min-height: 60px;
}

button {
  padding: 12px 27px;
  border: 0;
  border-radius: 20px;
  font: 16px Georgia, serif;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  outline: none;
}

#yes, #yes2 {
  background: #b9a8f5;
  color: white;
  position: relative;
  z-index: 2;
  transition: transform 0.2s ease;
}

#no {
  background: white;
  color: #7767a6;
  border: 1px solid #ded5fa;
  transition: left 0.12s ease, top 0.12s ease,
              transform 0.2s ease;
}

#no:focus, #no:active {
  background: white;
  color: #7767a6;
}

#second {
  display: none;
}

#tiny {
  position: fixed;
  bottom: 13px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 11px;
  color: #a99bd5;
}

.confetti {
  position: fixed;
  top: -15px;
  width: 9px;
  height: 12px;
  pointer-events: none;
  animation: fall 3s linear forwards;
  z-index: 10;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<main id="first">
  <h1>do you love me? ♡</h1>

  <img class="gif" src="milk-and-mocha-crying.gif" alt="">

  <div class="buttons" id="buttons">
    <button id="yes">yes ♡</button>
    <button id="no">no</button>
  </div>
</main>

<div id="tiny">idc if it's unfair🙄🙄</div>

<main id="second">
  <h1>YAYYYY I LOVE YOU MORE ♡</h1>

  <img class="gif" src="milk-and-mocha-milk-and-mocha-bear.gif" alt="">
</main>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const buttons = document.getElementById("buttons");

let size = 1;
let maxPresses = 0;
let yesMode = false;

function moveNo() {
  const margin = 12;
  const w = no.offsetWidth;
  const h = no.offsetHeight;
  const maxX = window.innerWidth - w - margin;
  const maxY = window.innerHeight - h - margin;
  const yesRect = yes.getBoundingClientRect();

  let x, y, attempts = 0;

  do {
    x = margin + Math.random() * Math.max(0, maxX - margin);
    y = margin + Math.random() * Math.max(0, maxY - margin);
    attempts++;
  } while (
    attempts < 100 &&
    x < yesRect.right + 12 &&
    x + w > yesRect.left - 12 &&
    y < yesRect.bottom + 12 &&
    y + h > yesRect.top - 12
  );

  no.style.position = "fixed";
  no.style.left = x + "px";
  no.style.top = y + "px";
  no.style.transform = "none";
}

no.addEventListener("click", () => {
  if (yesMode) {
    showLove();
    return;
  }

  if (maxPresses < 3) {
    maxPresses++;
    size += 0.35;
    yes.style.transform = `scale(${size})`;
    moveNo();
    return;
  }

  if (maxPresses >= 3) {
    no.dataset.extra = (Number(no.dataset.extra || 0) + 1);
    no.textContent = "no";

    if (Number(no.dataset.extra) >= 3) {
      yesMode = true;
      yes.style.transform = "scale(1)";
      yes.textContent = "yes ♡";
      no.textContent = "yes ♡";
      no.style.background = "#b9a8f5";
      no.style.color = "white";
      no.style.border = "none";
    } else {
      moveNo();
    }
  }
});

yes.addEventListener("click", showLove);

function showLove() {
  document.getElementById("first").style.display = "none";
  document.getElementById("tiny").style.display = "none";
  no.style.display = "none";
  document.getElementById("second").style.display = "flex";

  for (let i = 0; i < 150; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.backgroundColor = [
      "#b9a8f5", "#e8bce8", "#ffffff",
      "#d5c8ff", "#f6cce0"
    ][Math.floor(Math.random() * 5)];
    piece.style.animationDelay = Math.random() * 1.2 + "s";
    piece.style.animationDuration = (2 + Math.random() * 2) + "s";
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}

window.addEventListener("resize", () => {
  if (no.style.position === "fixed" && !yesMode) moveNo();
});
</script>

</body>
</html>
