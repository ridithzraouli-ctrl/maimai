
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #080d18;
  color: #e8edff;
  font-family: Georgia, serif;
  overflow: hidden;
}

main {
  text-align: center;
  padding: 24px;
  width: 100%;
}

h1 {
  font-size: clamp(28px, 7vw, 43px);
  font-weight: normal;
  margin-bottom: 14px;
}

p {
  color: #aebcde;
  font-size: 17px;
  margin-bottom: 30px;
}

.gif {
  display: block;
  width: min(220px, 65vw);
  max-height: 220px;
  object-fit: contain;
  margin: 0 auto 28px;
  border-radius: 12px;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  min-height: 65px;
}

button {
  border: 1px solid #536caa;
  border-radius: 12px;
  padding: 13px 28px;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.25s ease;
}

#yes {
  background: #a9c4ff;
  color: #080d18;
}

#no {
  background: transparent;
  color: #e8edff;
}

#second { display: none; }

.confetti {
  position: fixed;
  top: -20px;
  width: 9px;
  height: 13px;
  pointer-events: none;
  animation: fall 3s linear forwards;
  z-index: 10;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(900deg);
    opacity: 0;
  }
}
</style>
</head>
<body>

<main id="first">
  <h1>i love you so much ♡</h1>
  <p>do you love me back?</p>

  <img class="gif" src="https://tenor.com/fUrhmn5pOYP.gif" alt="">

  <div class="buttons" id="buttons">
    <button id="yes">yes ♡</button>
    <button id="no">no</button>
  </div>
</main>

<main id="second">
  <h1>YAYYYY I LOVE YOU MORE ♡</h1>

  <img class="gif" src="https://tenor.com/kpNB1IeLOkt.gif" alt="">
</main>

<script>
let size = 1;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const buttons = document.getElementById("buttons");

no.addEventListener("click", () => {
  size = Math.min(size + 0.15, 2.5);
  yes.style.transform = `scale(${size})`;

  buttons.style.flexDirection =
    Math.random() > 0.5 ? "row-reverse" : "row";

  no.textContent = size >= 2.5 ? "are you sure? ♡" : "no";
});

yes.addEventListener("click", () => {
  document.getElementById("first").style.display = "none";
  document.getElementById("second").style.display = "block";

  for (let i = 0; i < 150; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.backgroundColor = [
      "#a9c4ff", "#f5b7d2", "#ffffff",
      "#b8a5ff", "#83e6d0"
    ][Math.floor(Math.random() * 5)];
    piece.style.animationDelay = Math.random() * 1.5 + "s";
    piece.style.animationDuration = (2 + Math.random() * 2) + "s";
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
});
</script>

</body>
</html>
